apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "snorlx.fullname" . }}-backend
  labels:
    {{- include "snorlx.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "snorlx.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "snorlx.backend.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/secrets: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "snorlx.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: backend
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.backend.repository }}:{{ .Values.image.backend.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
              protocol: TCP
          env:
            - name: PORT
              value: "{{ .Values.backend.port }}"
            - name: LOG_LEVEL
              value: "{{ .Values.backend.env.LOG_LEVEL }}"
            - name: LOG_FORMAT
              value: "{{ .Values.backend.env.LOG_FORMAT }}"
            - name: RUN_POLL_INTERVAL
              value: "{{ .Values.backend.env.RUN_POLL_INTERVAL }}"
            - name: STORAGE_MODE
              value: database
            - name: FRONTEND_URL
              value: {{ include "snorlx.frontendUrl" . | quote }}
            - name: TRUSTED_PROXY_CIDRS
              value: {{ .Values.backend.trustedProxyCidrs | quote }}
            - name: ALLOWED_GITHUB_USERS
              value: {{ .Values.github.allowedUsers | quote }}
            - name: ALLOWED_GITHUB_ORGS
              value: {{ .Values.github.allowedOrgs | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "snorlx.secretName" . }}
                  key: postgres-password
            - name: DATABASE_URL
              value: {{ include "snorlx.databaseUrl" . | quote }}
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "snorlx.secretName" . }}
                  key: github-client-id
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "snorlx.secretName" . }}
                  key: github-client-secret
            - name: GITHUB_BASE_URL
              value: {{ .Values.github.baseUrl | quote }}
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "snorlx.secretName" . }}
                  key: github-webhook-secret
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "snorlx.secretName" . }}
                  key: session-secret
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
