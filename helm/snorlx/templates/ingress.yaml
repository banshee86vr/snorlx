{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "snorlx.fullname" . }}
  labels:
    {{- include "snorlx.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  {{- $basePath := include "snorlx.basePath" . }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          # API and WebSocket go straight to the backend; everything else is the SPA.
          - path: {{ $basePath }}/api
            pathType: Prefix
            backend:
              service:
                name: {{ include "snorlx.fullname" $ }}-backend
                port:
                  number: {{ $.Values.service.backend.port }}
          - path: {{ $basePath }}/ws
            pathType: Exact
            backend:
              service:
                name: {{ include "snorlx.fullname" $ }}-backend
                port:
                  number: {{ $.Values.service.backend.port }}
          - path: {{ default "/" $basePath }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "snorlx.fullname" $ }}-frontend
                port:
                  number: {{ $.Values.service.frontend.port }}
    {{- end }}
{{- end }}
