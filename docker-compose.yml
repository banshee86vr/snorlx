# Local production-like stack. The browser only talks to the frontend (http://localhost:5174):
# nginx serves the SPA and proxies /api and /ws to the backend, so cookies stay first-party and
# the backend Origin checks compare against FRONTEND_URL.
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      # POSTGRES_PASSWORD, SESSION_SECRET and the GitHub OAuth credentials come from .env
      - STORAGE_MODE=database
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/snorlx?sslmode=disable
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:?set GITHUB_CLIENT_ID in .env}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:?set GITHUB_CLIENT_SECRET in .env}
      - GITHUB_BASE_URL=${GITHUB_BASE_URL:-}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-}
      - ALLOWED_GITHUB_USERS=${ALLOWED_GITHUB_USERS:-}
      - ALLOWED_GITHUB_ORGS=${ALLOWED_GITHUB_ORGS:-}
      - RUN_POLL_INTERVAL=${RUN_POLL_INTERVAL:-10s}
      - SESSION_SECRET=${SESSION_SECRET:?set SESSION_SECRET in .env (openssl rand -base64 32)}
      - DEV_MODE=false
      - PORT=8080
      - LOG_LEVEL=info
      - LOG_FORMAT=json
      - FRONTEND_URL=http://localhost:5174
      # Only the frontend container (on the compose network) may set X-Forwarded-For
      - TRUSTED_PROXY_CIDRS=172.28.0.0/16
    # Not published on the host: reachable only through the frontend proxy
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      - BACKEND_UPSTREAM=http://backend:8080
    ports:
      - "127.0.0.1:5174:8080"
    depends_on:
      - backend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /etc/nginx/conf.d
    security_opt:
      - no-new-privileges:true

  db:
    # Pinned by digest to avoid unintended upgrades
    image: timescale/timescaledb:2.30.0-pg16@sha256:75d58b53f3337a6babd3a1cce5e503f2300bdede62dd7d743651deb1a95b6d76
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=snorlx
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Loopback only, for local psql access
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  pgdata:
