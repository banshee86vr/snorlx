name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, such as v1.0.0. Leave empty to use release-please or the tag already on this commit.
        required: false
        type: string

# Actions are pinned to full commit SHAs (tag in the trailing comment). Dependabot keeps them current.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────
  # release-please: open the release PR, or tag and publish
  # ─────────────────────────────────────────────────────────────
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
      patch: ${{ steps.release.outputs.patch }}

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.0.0-beta.6
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}

  # ─────────────────────────────────────────────────────────────
  # Resolve which tag to publish. A re-run does not recreate the
  # release, so a tag already on this commit still publishes.
  # ─────────────────────────────────────────────────────────────
  resolve:
    name: Resolve release tag
    needs: release-please
    if: always() && needs.release-please.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.resolve.outputs.publish }}
      tag_name: ${{ steps.resolve.outputs.tag_name }}
      version: ${{ steps.resolve.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Resolve tag
        id: resolve
        env:
          RELEASE_CREATED: ${{ needs.release-please.outputs.release_created }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag=""
          if [ "$RELEASE_CREATED" = "true" ]; then
            tag="$RELEASE_TAG"
          elif [ -n "$MANUAL_TAG" ]; then
            tag="$MANUAL_TAG"
          else
            git fetch --force origin "+refs/tags/v*:refs/tags/v*"
            tag="$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          fi

          if [ -z "$tag" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! printf '%s\n' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Refusing tag that is not a plain version: $tag" >&2
            exit 1
          fi

          {
            echo "publish=true"
            echo "tag_name=$tag"
            echo "version=${tag#v}"
          } >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────
  # Verify the release is immutable before any artifact is pushed.
  # This job is separate so a failed check can be re-run without
  # losing the tag release-please already created.
  # ─────────────────────────────────────────────────────────────
  verify:
    name: Verify immutable release
    needs: resolve
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read

    steps:
      - name: Verify immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag_name }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if gh release verify "$TAG" --repo "$GITHUB_REPOSITORY"; then
              exit 0
            fi
            echo "Release attestation not ready (attempt ${attempt}); retrying"
            sleep 5
          done
          exit 1

  # ─────────────────────────────────────────────────────────────
  # Images: exact version tag, linux/amd64 and linux/arm64, with
  # SLSA provenance, SBOM and a keyless cosign signature.
  # ─────────────────────────────────────────────────────────────
  images:
    name: Publish image
    needs: [resolve, verify]
    if: needs.verify.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
        include:
          - component: backend
            image: ghcr.io/banshee86vr/snorlx-backend
            context: backend
            file: backend/Dockerfile
            build_args: ""
          - component: frontend
            image: ghcr.io/banshee86vr/snorlx-frontend
            context: .
            file: frontend/Dockerfile
            build_args: VITE_API_URL=

    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.tag_name }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.image }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.resolve.outputs.tag_name }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Sign image (keyless, Sigstore)
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Record image digest
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────────────────────
  # Chart: OCI push, version tag only, signed with cosign
  # ─────────────────────────────────────────────────────────────
  chart:
    name: Helm chart
    needs: [resolve, verify]
    if: needs.verify.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.tag_name }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # cosign reads the Docker keychain, helm its own registry config: both logins are needed.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint chart
        run: helm lint helm/snorlx --set backend.frontendUrl=https://snorlx.example.com

      - name: Package, push and sign chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          tgz=$(helm package helm/snorlx | awk '{print $NF}')
          push_output=$(helm push "$tgz" oci://ghcr.io/banshee86vr/charts 2>&1)
          echo "$push_output"
          digest=$(printf '%s\n' "$push_output" | awk '/^Digest:/ {print $2}')
          cosign sign --yes "ghcr.io/banshee86vr/charts/snorlx@${digest}"
          echo "oci://ghcr.io/banshee86vr/charts/snorlx:${VERSION} (${digest})" >> "$GITHUB_STEP_SUMMARY"
